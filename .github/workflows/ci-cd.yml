name: CI/CD — Calculadora MEI

on:
  push:
    branches:
      - main        # deploy em produção
      - develop     # deploy em preview
  pull_request:
    branches:
      - main      

jobs:

  #  JOB 1: Valida o código antes de qualquer deploy 
  qualidade:
    name: Verificação de Qualidade
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos obrigatórios
        run: |
          echo "Verificando estrutura do projeto..."
          test -f index.html    || (echo "❌ index.html não encontrado" && exit 1)
          test -f css/style.css || (echo "❌ css/style.css não encontrado" && exit 1)
          test -f js/script.js  || (echo "❌ js/script.js não encontrado" && exit 1)
          test -f vercel.json   || (echo "❌ vercel.json não encontrado" && exit 1)
          test -f sw.js         || (echo "❌ sw.js não encontrado" && exit 1)
          echo "✅ Todos os arquivos encontrados"

      - name: Verificar tamanho dos assets
        run: |
          CSS_SIZE=$(wc -c < css/style.css)
          JS_SIZE=$(wc -c < js/script.js)
          echo "CSS: ${CSS_SIZE} bytes | JS: ${JS_SIZE} bytes"
          [ "$CSS_SIZE" -lt 51200 ] || (echo "❌ CSS maior que 50KB" && exit 1)
          [ "$JS_SIZE"  -lt 102400 ] || (echo "❌ JS maior que 100KB" && exit 1)
          echo "✅ Tamanho dos assets dentro do limite"

  # JOB 2: Deploy em preview (PRs e branch develop) 
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: qualidade
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Vercel CLI
        run: npm install -g vercel --silent

      - name: Deploy para Preview
        id: preview
        run: |
          PREVIEW_URL=$(vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes \
            2>/dev/null | tail -n1)
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "✅ Preview: $PREVIEW_URL"

      - name: Comentar URL na Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview disponível!\n\n**URL:** ${{ steps.preview.outputs.url }}\n\n> Gerado automaticamente pelo GitHub Actions`
            })

  #  JOB 3: Deploy em produção 
  deploy-producao:
    name: Deploy Produção
    runs-on: ubuntu-latest
    needs: qualidade
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Vercel CLI
        run: npm install -g vercel --silent

      - name: Deploy para Produção
        id: producao
        run: |
          PROD_URL=$(vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --prod \
            --yes \
            2>/dev/null | tail -n1)
          echo "url=$PROD_URL" >> $GITHUB_OUTPUT
          echo "✅ Produção: $PROD_URL"

      - name: Smoke test — verifica se o site respondeu
        run: |
          URL="${{ steps.producao.outputs.url }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "Status HTTP: $STATUS"
          [ "$STATUS" = "200" ] || (echo "❌ Site não respondeu 200!" && exit 1)
          echo "✅ Smoke test passou — site no ar"

      - name: Resumo do deploy
        if: success()
        run: |
          echo "🎉 Deploy concluído!"
          echo "URL: ${{ steps.producao.outputs.url }}"
          echo "Commit: ${{ github.sha }}"