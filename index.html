<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora MEI</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="container">
    <section class="card" aria-labelledby="titulo">
      <h1 id="titulo">Calculadora MEI</h1>
      <p>Calcule uma estimativa simples dos valores do MEI.</p>

      <form id="form-calculadora">
        <div class="campo">
          <label for="faturamento">Faturamento mensal</label>
          <input 
            type="number" 
            id="faturamento" 
            name="faturamento"
            placeholder="Ex: 5000"
            min="0"
            required
          >
        </div>

        <div class="campo">
          <label for="atividade">Tipo de atividade</label>
          <select id="atividade" name="atividade" required>
            <option value="">Selecione</option>
            <option value="comercio">Comércio</option>
            <option value="servico">Serviço</option>
            <option value="industria">Indústria</option>
          </select>
        </div>

        <button type="submit" aria-label="Calcular valores do MEI">
          Calcular
        </button>

        <p id="mensagem-erro" class="erro" aria-live="polite"></p>
      </form>

      <section id="resultado" class="resultado" aria-live="polite"></section>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
